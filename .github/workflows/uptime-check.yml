name: Uptime check

# Verifies the catalog site, its PDF proxy (functions/api/pdf.js) and the
# Google cover images. If anything breaks, this job fails and GitHub emails
# the repo owner. Every step runs, so one failure does not hide another.
on:
  schedule:
    - cron: '0 13 * * *'   # daily, 13:00 UTC
  workflow_dispatch:

permissions:
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The PDF proxy is part of the Pages site. If it fails, readers still see
      # the catalogue in Google Drive's viewer, but the flipbook is off.
      - name: PDF proxy serves a PDF
        run: |
          URL="https://catalog-flipbook-app.pages.dev/api/pdf?id=1e7Y5sCgp3foWHfrd_VMhZGG_YMU6NA9T"
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/head.bin -w '%{http_code}' --max-time 60 -H 'Range: bytes=0-1023' "$URL" || echo 000)
            magic=$(head -c 5 /tmp/head.bin 2>/dev/null || true)
            echo "attempt $attempt: HTTP $code, starts with '$magic'"
            if { [ "$code" = "206" ] || [ "$code" = "200" ]; } && [ "$magic" = "%PDF-" ]; then
              echo "PDF proxy healthy."
              exit 0
            fi
            if grep -qi "exceeded\|1027" /tmp/head.bin 2>/dev/null; then
              echo "::error::Cloudflare is over its daily free request limit for Functions (100,000). It resets at 00:00 UTC."
              exit 1
            fi
            sleep 15
          done
          echo "::error::The PDF proxy (/api/pdf) is not serving PDFs. Check the latest Pages deployment in the Cloudflare dashboard, and that the Drive files are shared with anyone with the link."
          exit 1

      - name: Covers load from Google
        if: always()
        run: |
          code=$(curl -s -L -o /tmp/cover.bin -w '%{http_code}' --max-time 30 "https://lh3.googleusercontent.com/d/1e7Y5sCgp3foWHfrd_VMhZGG_YMU6NA9T=w600" || echo 000)
          type=$(file -b --mime-type /tmp/cover.bin 2>/dev/null || echo unknown)
          echo "cover: HTTP $code, $type"
          [ "$code" = "200" ] && [ "${type#image/}" != "$type" ] || { echo "::error::Cover images are not loading from Google (check the Drive files are shared with anyone with the link)"; exit 1; }

      - name: Catalog site responds
        if: always()
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://catalog-flipbook-app.pages.dev/)
          echo "site: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Catalog site returned $code"; exit 1; }

      # Catalogues are linked by Drive file ID. Deleting a PDF and re-uploading
      # it gives it a new ID, which breaks the live link until the next sync.
      - name: Every live catalogue still exists in Drive
        if: always()
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GOOGLEAPIKEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.parse
          key, folder = os.environ['GOOGLE_API_KEY'], '1U2_lMcMB8IxVL-1HVIHtF8N9FarJ18aL'
          ids, token = set(), ''
          while True:
              q = {'key': key, 'pageSize': 1000, 'fields': 'nextPageToken,files(id)',
                   'q': f"'{folder}' in parents and mimeType='application/pdf' and trashed=false"}
              if token: q['pageToken'] = token
              d = json.load(urllib.request.urlopen('https://www.googleapis.com/drive/v3/files?' + urllib.parse.urlencode(q)))
              ids |= {f['id'] for f in d.get('files', [])}
              token = d.get('nextPageToken')
              if not token: break
          # Cloudflare rejects Python's default User-Agent
          req = urllib.request.Request('https://catalog-flipbook-app.pages.dev/catalogs.json',
                                       headers={'User-Agent': 'catalog-uptime-check'})
          live = json.load(urllib.request.urlopen(req))['catalogs']
          broken = [c['title'] for c in live if c['driveFileId'] not in ids]
          print(f'{len(live)} live catalogues, {len(ids)} PDFs in Drive, {len(broken)} broken')
          for t in broken: print(f'::error::Broken on site (file replaced or deleted in Drive): {t}')
          sys.exit(1 if broken else 0)
          PY

      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/uptime-check.yml/enable"
