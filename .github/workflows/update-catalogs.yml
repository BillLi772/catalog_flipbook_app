name: Weekly catalog sync

on:
  schedule:
    # Every Sunday at 6:00 AM UTC
    - cron: '0 6 * * 0'
  # Allow running manually from the GitHub Actions tab
  workflow_dispatch:

# The job pushes catalogs.json back to main, and re-enables itself (below).
permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Rebuild catalogs.json from Google Drive
        env:
          # The repo secret was saved as GOOGLEAPIKEY; accept either spelling.
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GOOGLEAPIKEY }}
        run: node scripts/build-catalog.js

      - name: Commit and push if catalogs changed
        run: |
          git config user.name  "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add catalogs.json
          if git diff --cached --quiet; then
            echo "No changes to catalogs.json — skipping commit."
          else
            git commit -m "chore: weekly catalog sync $(date +'%Y-%m-%d')"
            git push
          fi

      # GitHub switches off scheduled workflows after 60 days without a commit.
      # Weeks with no new catalogs make no commit, so re-enable explicitly to
      # reset that timer — otherwise the sync silently stops again.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-catalogs.yml/enable"
